plugins {
    id 'com.android.application'
}

android {
    namespace 'com.newyear.banner'
    compileSdk 34

    defaultConfig {
        applicationId "com.newyear.banner"
        minSdk 21            // Android 5.0 — почти все школьные телефоны
        targetSdk 34
        versionCode 1
        versionName "1.0"
        // RuStore требует русскую локаль — добавляем в ресурсы (res/values-ru)
    }

    signingConfigs {
        release {
            // Ключ для публикации в RuStore создайте сами:
            //   keytool -genkey -v -keystore nybanner.keystore -alias nybanner -keyalg RSA -keysize 2048 -validity 10000
            // и раскомментируйте строки ниже (пароли лучше через gradle.properties / env)
            // storeFile file("../nybanner.keystore")
            // storePassword System.getenv("KS_PASS")
            // keyAlias "nybanner"
            // keyPassword System.getenv("KEY_PASS")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // signingConfig signingConfigs.release  // включите после создания ключа RuStore
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { viewBinding true }
    lint { abortOnError false }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'        // HTTP к ленте (Wi-Fi)
    implementation 'com.google.code.gson:gson:2.11.0'          // JSON плейлиста/статуса
    implementation 'org.jsoup:jsoup:1.17.2'                    // парсер HTML сайта для загрузки прошивки
}
